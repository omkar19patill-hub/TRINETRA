<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRINETRA &middot; Blockchain Decision Provenance Tester</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0f1d;
      --bg-card: rgba(16, 24, 45, 0.85);
      --bg-card-border: rgba(56, 189, 248, 0.15);
      --accent-cyan: #38bdf8;
      --accent-blue: #3b82f6;
      --accent-emerald: #10b981;
      --accent-rose: #f43f5e;
      --accent-amber: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --code-bg: #030712;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(59, 130, 246, 0.08) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 760px;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--bg-card-border);
      border-radius: 20px;
      padding: 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(56, 189, 248, 0.05);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 18px;
    }

    .logo-badge {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      color: #030712;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }

    .title-group h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .title-group p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .network-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--accent-emerald);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .network-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-emerald);
      box-shadow: 0 0 8px var(--accent-emerald);
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      background: rgba(3, 7, 18, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 12px 16px;
      color: var(--text-main);
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      transition: all 0.2s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    .quick-picks {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .chip-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 11px;
      padding: 4px 10px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .chip-btn:hover {
      background: rgba(56, 189, 248, 0.12);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 20px;
    }

    button.action-btn {
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-record {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }

    .btn-record:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
    }

    .btn-verify {
      background: linear-gradient(135deg, #059669, #047857);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    }

    .btn-verify:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
    }

    .test-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 10px;
      border: 1px dashed rgba(255, 255, 255, 0.1);
      margin-bottom: 24px;
    }

    .test-controls span {
      font-size: 12px;
      color: var(--text-muted);
    }

    .test-btn-group {
      display: flex;
      gap: 8px;
    }

    .btn-tamper {
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.4);
      color: #fda4af;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-tamper:hover {
      background: var(--accent-rose);
      color: #fff;
    }

    .btn-reset {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-reset:hover {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text-main);
    }

    /* Result Banner */
    #result-banner {
      display: none;
      padding: 24px;
      border-radius: 16px;
      margin-top: 10px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .banner-verified {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.4);
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.15);
    }

    .banner-mismatch {
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.4);
      box-shadow: 0 0 30px rgba(244, 63, 94, 0.15);
    }

    .banner-recorded {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.15);
    }

    .banner-header {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .banner-verified .banner-header { color: var(--accent-emerald); }
    .banner-mismatch .banner-header { color: var(--accent-rose); }
    .banner-recorded .banner-header { color: var(--accent-cyan); }

    .banner-body {
      font-size: 13px;
      line-height: 1.6;
      color: #cbd5e1;
    }

    .hash-audit-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
    }

    .hash-row {
      background: rgba(0, 0, 0, 0.4);
      padding: 8px 12px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow-x: auto;
    }

    .hash-label {
      color: var(--text-muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .hash-val {
      color: var(--accent-cyan);
      word-break: break-all;
    }

    .hash-val.mismatch {
      color: var(--accent-rose);
      font-weight: 700;
    }

    .footer-note {
      text-align: center;
      margin-top: 24px;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="logo-badge">
        <div class="logo-icon">T</div>
        <div class="title-group">
          <h1>TRINETRA Decision Provenance</h1>
          <p>Blockchain-Backed Tamper-Evident Risk Record</p>
        </div>
      </div>
      <div class="network-badge" id="ledger-status">LocalLedger &middot; Active</div>
    </div>

    <div class="form-group">
      <label for="assessment-id-input">Assessment ID</label>
      <div class="input-row">
        <input type="text" id="assessment-id-input" value="CRQ-001" placeholder="e.g. CRQ-001" />
      </div>
      <div class="quick-picks">
        <span style="font-size: 11px; color: #64748b; align-self: center;">Preset:</span>
        <button class="chip-btn" onclick="setAssessmentId('CRQ-001')">CRQ-001 (Benchmark)</button>
        <button class="chip-btn" onclick="setAssessmentId('CRQ-ENTERPRISE-001')">CRQ-ENTERPRISE-001 (Banking)</button>
      </div>
    </div>

    <div class="btn-group">
      <button class="action-btn btn-record" id="btn-record" onclick="recordDecision()">
        <span>🔗</span> Record Decision
      </button>
      <button class="action-btn btn-verify" id="btn-verify" onclick="verifyDecision()">
        <span>🔍</span> Verify Decision
      </button>
    </div>

    <div class="test-controls">
      <span>Tamper-testing simulation:</span>
      <div class="test-btn-group">
        <button class="btn-tamper" onclick="tamperDecision()">⚠️ Tamper Local Result</button>
        <button class="btn-reset" onclick="resetDecision()">🔄 Reset Original</button>
      </div>
    </div>

    <div id="result-banner">
      <!-- Dynamic Banner Injected via JS -->
    </div>

    <div class="footer-note">
      Security Guarantee: Only SHA-256 digests and provenance metadata are anchored on-chain. No raw CSVs or secrets stored.
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;

    function setAssessmentId(id) {
      document.getElementById('assessment-id-input').value = id;
    }

    async function recordDecision() {
      const assessmentId = document.getElementById('assessment-id-input').value.trim();
      if (!assessmentId) return alert('Please enter an Assessment ID');

      const banner = document.getElementById('result-banner');
      banner.style.display = 'block';
      banner.className = 'banner-recorded';
      banner.innerHTML = `<div class="banner-header">⏳ Recording to Blockchain...</div><div class="banner-body">Submitting canonical provenance hash to immutable block ledger...</div>`;

      try {
        const res = await fetch(`${API_BASE}/blockchain/record`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            assessment_id: assessmentId,
            decision_id: assessmentId.replace('CRQ', 'OPT'),
            model_version: '1.0'
          })
        });

        const data = await res.json();
        if (!res.ok && res.status !== 409) {
          throw new Error(data.detail || 'Failed to record');
        }

        const isAlready = data.status === 'ALREADY_RECORDED';
        banner.className = 'banner-recorded';
        banner.innerHTML = `
          <div class="banner-header">🔗 ${isAlready ? 'Decision Already Anchored' : 'Decision Successfully Anchored'}</div>
          <div class="banner-body">
            ${isAlready ? 'This assessment is already immutably recorded on-chain.' : 'Decision hash has been securely sealed into a new cryptographic block.'}
            <div class="hash-audit-grid">
              <div class="hash-row"><span class="hash-label">Transaction Hash</span><span class="hash-val">${data.tx_hash}</span></div>
              <div class="hash-row"><span class="hash-label">Block Height</span><span class="hash-val">Block #${data.block_height} (Hash: ${data.block_hash.substring(0, 18)}...)</span></div>
              <div class="hash-row"><span class="hash-label">Result Hash Anchored</span><span class="hash-val">${data.result_hash}</span></div>
              <div class="hash-row"><span class="hash-label">Snapshot Hash Anchored</span><span class="hash-val">${data.data_snapshot_hash}</span></div>
            </div>
          </div>
        `;
      } catch (err) {
        banner.className = 'banner-mismatch';
        banner.innerHTML = `<div class="banner-header">❌ Record Error</div><div class="banner-body">${err.message}</div>`;
      }
    }

    async function verifyDecision() {
      const assessmentId = document.getElementById('assessment-id-input').value.trim();
      if (!assessmentId) return alert('Please enter an Assessment ID');

      const banner = document.getElementById('result-banner');
      banner.style.display = 'block';
      banner.className = 'banner-recorded';
      banner.innerHTML = `<div class="banner-header">🔍 Auditing Blockchain Provenance...</div><div class="banner-body">Recomputing canonical hashes and verifying on-chain ledger proof...</div>`;

      try {
        const res = await fetch(`${API_BASE}/blockchain/verify/${encodeURIComponent(assessmentId)}`);
        const data = await res.json();

        if (data.verified) {
          banner.className = 'banner-verified';
          banner.innerHTML = `
            <div class="banner-header">✅ Verified</div>
            <div class="banner-body">
              <strong>${data.message}</strong>
              <div class="hash-audit-grid">
                <div class="hash-row"><span class="hash-label">Status</span><span class="hash-val" style="color: #10b981;">VERIFIED &middot; AUDIT PASSED</span></div>
                <div class="hash-row"><span class="hash-label">Block Reference</span><span class="hash-val">Block #${data.block_height} (Tx: ${data.tx_hash.substring(0, 16)}...)</span></div>
                <div class="hash-row"><span class="hash-label">On-Chain Result Hash</span><span class="hash-val">${data.on_chain_result_hash}</span></div>
                <div class="hash-row"><span class="hash-label">Computed Local Result Hash</span><span class="hash-val">${data.computed_result_hash}</span></div>
              </div>
            </div>
          `;
        } else {
          banner.className = 'banner-mismatch';
          banner.innerHTML = `
            <div class="banner-header">❌ Integrity mismatch</div>
            <div class="banner-body">
              <strong>${data.message}</strong>
              <div class="hash-audit-grid">
                <div class="hash-row"><span class="hash-label">Audit Status</span><span class="hash-val mismatch">${data.status}</span></div>
                <div class="hash-row"><span class="hash-label">On-Chain Result Hash</span><span class="hash-val">${data.on_chain_result_hash || 'None'}</span></div>
                <div class="hash-row"><span class="hash-label">Computed Local Result Hash</span><span class="hash-val mismatch">${data.computed_result_hash || 'None'}</span></div>
              </div>
            </div>
          `;
        }
      } catch (err) {
        banner.className = 'banner-mismatch';
        banner.innerHTML = `<div class="banner-header">❌ Verification Error</div><div class="banner-body">${err.message}</div>`;
      }
    }

    async function tamperDecision() {
      const assessmentId = document.getElementById('assessment-id-input').value.trim();
      try {
        const res = await fetch(`${API_BASE}/blockchain/tamper-test/${encodeURIComponent(assessmentId)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tamper_type: 'modify_eal', custom_value: 999999.0 })
        });
        const data = await res.json();
        alert(`⚠️ Local result for '${assessmentId}' tampered (EAL changed to 999,999.0)!\nNow click [ Verify Decision ] to test integrity failure detection.`);
      } catch (err) {
        alert('Tamper simulation error: ' + err.message);
      }
    }

    async function resetDecision() {
      const assessmentId = document.getElementById('assessment-id-input').value.trim();
      try {
        const res = await fetch(`${API_BASE}/blockchain/reset-test/${encodeURIComponent(assessmentId)}`, {
          method: 'POST'
        });
        alert(`🔄 Assessment '${assessmentId}' restored to pristine untampered state.`);
      } catch (err) {
        alert('Reset error: ' + err.message);
      }
    }
  </script>
</body>
</html>
